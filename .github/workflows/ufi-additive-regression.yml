name: UFI additive regression checks

on:
  push:
    branches:
      - feature/5400-bookmaker-edge-gate
      - main
  pull_request:
    branches:
      - feature/5400-bookmaker-edge-gate
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile existing Python modules
        run: python -m compileall -q tools
      - name: Run additive backend regression tests
        run: python -m unittest discover -s tests -p "test_ufi_*.py" -v
