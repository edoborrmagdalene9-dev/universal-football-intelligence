name: OpenRouter adapter regression
on:
  pull_request:
  push:
    branches:
      - feature/ufi-openrouter-server-adapter
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q tools
      - run: python -m unittest discover -s tests -p 'test_ufi_openrouter_adapter.py'
