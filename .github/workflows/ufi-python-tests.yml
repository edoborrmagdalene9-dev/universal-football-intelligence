name: UFI Python tests
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main", "feature/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r dfs_optimizer/requirements.txt
      - run: python -m compileall -q dfs_optimizer
      - run: python -m pytest dfs_optimizer/tests -q
