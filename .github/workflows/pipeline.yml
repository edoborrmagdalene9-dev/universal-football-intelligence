name: FantasyFi Quantitative Pipeline

on:
  workflow_dispatch:
    inputs:
      players_csv:
        description: "Repository-relative player projections CSV"
        required: false
        default: "dfs_optimizer/datasets/players_template.csv"
  schedule:
    # Placeholder cadence only. GitHub cron is UTC and may be delayed.
    # Replace with a verified lock-aware schedule for a chosen competition.
    - cron: "15 * * * *"
  push:
    branches:
      - "feature/fantasyfi-quantitative-engine"

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: python -m pip install -r dfs_optimizer/requirements.txt
      - run: python -m pytest dfs_optimizer/tests -q
      - name: Note live provider is not configured
        run: echo "Tests and local pipeline only; live confirmed-lineup fetch requires a permitted provider integration."

  optional-lineup-build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r dfs_optimizer/requirements.txt
      - name: Check input exists
        env:
          PLAYERS_CSV: ${{ inputs.players_csv }}
        run: test -f "$PLAYERS_CSV"
      - name: Build entry CSV
        env:
          PLAYERS_CSV: ${{ inputs.players_csv }}
        run: |
          python -m dfs_optimizer.src.automation.main --players "$PLAYERS_CSV" --output fantasyfi_entries.csv --roster-size 9 --salary-cap 100 --positions-json '{"GK":1,"DEF":3,"MID":3,"FWD":2}'
      - uses: actions/upload-artifact@v4
        with:
          name: fantasyfi-entry-csv
          path: fantasyfi_entries.csv
