name: UFI nightly operations regression
on:
  pull_request:
  push:
    branches:
      - feature/ufi-nightly-schedule-default-branch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q tools
      - run: python -m unittest discover -s tests -p 'test_ufi_nightly_runner.py'
      - run: python -m unittest discover -s tests -p 'test_ufi_observability.py'
