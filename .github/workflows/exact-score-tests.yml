name: UFI Exact-Score Module Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  exact-score-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test exact-score intelligence module
        run: node --test tests/exact-score-intelligence.test.js
      - name: Test live correct-score and chaos engine
        run: node --test tests/live-correct-score-chaos-engine.test.cjs
      - name: Test universal event and trap engine
        run: node --test tests/universal-match-state-engine.test.cjs
      - name: Test live market shock and historical backtest UI
        run: node --test tests/live-market-shock-backtest.test.cjs
      - name: Test 5400 bookmaker-edge gate
        run: node --test tests/bookie-edge-5400.test.cjs
      - name: Test existing Python suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
