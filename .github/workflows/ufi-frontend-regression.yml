name: UFI frontend syntax regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check existing browser modules without changing behavior
        run: |
          for file in app.js exact-score-intelligence.js live-correct-score-chaos-engine.js universal-match-state-engine.js live-market-shock-backtest.js audit-intelligence.js ai-council.js calculator-risk-engine.js; do
            node --check "$file"
          done
