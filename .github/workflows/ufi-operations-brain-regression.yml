name: UFI Operations Brain Regression

on:
  push:
    branches: [feature/ufi-operations-brain]
    paths:
      - 'tools/ufi_operations_brain.py'
      - 'tests/test_ufi_operations_brain.py'
      - '.github/workflows/ufi-operations-brain-regression.yml'
  pull_request:
    paths:
      - 'tools/ufi_operations_brain.py'
      - 'tests/test_ufi_operations_brain.py'
      - '.github/workflows/ufi-operations-brain-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations-brain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile additive operations module
        run: python -m py_compile tools/ufi_operations_brain.py tests/test_ufi_operations_brain.py
      - name: Run operations brain regression tests
        run: python -m unittest tests.test_ufi_operations_brain -v
