name: UFI GDELT and telemetry hotfix regression
on:
  pull_request:
  push:
    branches:
      - feature/5400-bookmaker-edge-gate
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q tools
      - run: python -m unittest discover -s tests -p 'test_ufi_council_failover.py'
      - run: python -m unittest discover -s tests -p 'test_ufi_observability.py'
