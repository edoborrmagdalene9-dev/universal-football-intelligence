name: Download free OpenFootball data

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First season start year (example: 2010 for 2010/11)"
        required: true
        default: "2010"
      end_year:
        description: "Last season start year (example: 2025 for 2025/26)"
        required: true
        default: "2025"
      leagues:
        description: "Comma-separated codes; default covers configured leagues"
        required: true
        default: "en.1,en.2,en.3,en.4,de.1,de.2,es.1,es.2,it.1,it.2,fr.1,fr.2,nl.1,pt.1,sco.1"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out UFI
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and normalize public-domain results
        run: |
          python tools/openfootball_download.py \
            --start-year "${{ inputs.start_year }}" \
            --end-year "${{ inputs.end_year }}" \
            --leagues "${{ inputs.leagues }}" \
            --out output/openfootball
      - name: Validate dataset and publish summary
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("output/openfootball")
          manifest_path = root / "manifest.json"
          csv_path = root / "matches.csv"
          if not manifest_path.is_file() or not csv_path.is_file():
              raise SystemExit("Expected manifest.json and matches.csv were not created.")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          with csv_path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              rows = sum(1 for _ in reader)

          expected = int(manifest.get("match_rows", -1))
          if rows != expected:
              raise SystemExit(f"CSV row count ({rows}) does not match manifest ({expected}).")
          if rows == 0:
              raise SystemExit("No match rows were downloaded; refusing to mark dataset valid.")

          summary = [
              "## UFI OpenFootball dataset validation",
              "",
              f"- **Seasons requested:** {manifest.get('start_year')}–{manifest.get('end_year')}",
              f"- **League-season files found:** {manifest.get('files_found')}",
              f"- **Match rows in CSV:** {rows:,}",
              f"- **CSV:** `output/openfootball/matches.csv`",
              f"- **Raw JSON files:** `output/openfootball/raw/`",
              "",
              "Dataset validation passed. Download the artifact only if you need the raw files locally."
          ]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\\n".join(summary) + "\\n")
          print(f"Validated {rows} match rows across {manifest.get('files_found')} source files.")
          PY
      - name: Run chronological baseline backtest
        run: |
          python tools/openfootball_backtest.py \
            --input output/openfootball/matches.csv \
            --out output/openfootball/model
          python - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path("output/openfootball/model/metrics.json").read_text(encoding="utf-8"))
          lines = [
              "",
              "## UFI chronological baseline backtest",
              "",
              f"- **Matches evaluated:** {metrics['backtested_matches']:,}",
              f"- **1X2 accuracy:** {metrics['accuracy_1x2']}",
              f"- **Mean Brier score:** {metrics['mean_brier_1x2']}",
              f"- **Mean log loss:** {metrics['mean_logloss_1x2']}",
              "- **Forecasting method:** rolling home/away team-goal rates using only earlier matches",
              "- **Outputs:** `output/openfootball/model/metrics.json` and `chronological_predictions.csv`",
              "",
              "These are baseline metrics, not proof of betting profitability. Compare with naive baselines and validate by league/season."
          ]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufi-openfootball-${{ inputs.start_year }}-${{ inputs.end_year }}
          path: output/openfootball/
          if-no-files-found: error
          retention-days: 14
