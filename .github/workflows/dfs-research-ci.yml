name: Advanced DFS Research CI
on:
  pull_request:
    paths: ['dfs_optimizer/**', 'docs/god-mode-dfs-engine.md', '.github/workflows/dfs-research-ci.yml']
  push:
    branches: ['feature/fantasyfi-microbehavioral-engine']
    paths: ['dfs_optimizer/**', 'docs/god-mode-dfs-engine.md', '.github/workflows/dfs-research-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dfs_optimizer/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r dfs_optimizer/requirements.txt scikit-learn
      - run: python -m compileall -q dfs_optimizer
      - run: pytest -q dfs_optimizer/tests
        env:
          PYTHONPATH: .
